
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>My Website</h2>

        <nav>

        <div class="container">

            <div class="card">
                <img src="https://picsum.photos/300/180?random=1" alt="Project 1">

            <div class="card">
                <img src="https://picsum.photos/300/180?random=2" alt="Project 2">
                <h3>Project Two</h3>

            <div class="card">
                <img src="https://picsum.photos/300/180?random=3" alt="Project 3">
                <h3>Project Three</h3>
                <p>Learning responsive layouts.</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/180?random=4" alt="Project 4">

                <p>Created using Flexbox.</p>
            </div>

        </div>
