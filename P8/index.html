
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar and Card Overlay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>My Portfolio</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <section id="home">
            <h1>Welcome to My Portfolio</h1>
            <p>This is my personal website.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>I am learning HTML, CSS and Java.</p>
        </section>

        <section id="projects">
            <h2>My Projects</h2>

            <div class="card">
                <img src="https://picsum.photos/400/250" alt="Project image">

                <div class="overlay">
                    <h3>My First Project</h3>
                    <p>Created using HTML and CSS.</p>
                </div>
            </div>

        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Email: example@gmail.com</p>
        </section>

    </main>

    <footer>
        <p>Made by Jeevan | 2026</p>
    </footer>

</body>
</html>
